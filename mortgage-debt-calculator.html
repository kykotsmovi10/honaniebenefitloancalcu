<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Debt Consolidation Calculator</title>
<meta name="theme-color" content="#1e2b4d"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
:root{
  --navy:#1e2b4d; --navy-deep:#172239; --navy-soft:#2b3652;
  --gold:#c3a163;
  --green:#6f7f2e; --green-text:#68762b; --green-deep:#3e4a1e; --green-bright:#a8c44a;
  --callout:#eef3d8;
  --red:#b03030; --red-soft:#e08a8a; --red-bg:#fdecea; --red-line:#e8b4b4;
  --panel:#f1f4f9; --panel-line:#dee1e9; --border:#dfe4ee; --card:#fff;
  --panel-dark:#141a26; --panel-dark-line:#2c3548; --panel-dark-muted:#9aa3b5;
  --ink:#1e2b4d; --muted:#1a1a1a; --dim:#7d8699;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--panel);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1}

.bar{background:var(--navy);color:#fff;padding:22px 40px}
.bar h1{font-size:23px;font-weight:700;letter-spacing:-.4px;line-height:1.2}
.bar h1 span{color:var(--gold)}
.bar .tag{display:block;font-size:12.5px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-top:4px}

.wrap{max-width:1080px;margin:0 auto;padding:24px 24px 60px}

.card{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 2px 8px rgba(30,43,77,.07);overflow:hidden;margin-bottom:20px}
.cardhdr{background:var(--navy);color:#fff;padding:15px 22px;font-size:17px;font-weight:700;letter-spacing:-.3px}
.cardhdr span{color:var(--gold);font-weight:600}
.cardbody{padding:22px 24px}

/* ── DEBT INPUT ROWS ── */
.chead{display:flex;gap:10px;padding:0 0 8px;font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.8px}
.chead .c-name{flex:2 1 130px}
.chead .c-type{flex:1 1 110px}
.chead .c-num{flex:1 1 100px;text-align:right}
.chead .c-x{width:30px}
.crow{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--panel-line);flex-wrap:wrap}
.crow .f-name{flex:2 1 130px}
.crow .f-type{flex:1 1 110px}
.crow .f-num{flex:1 1 100px}
.inpwrap{display:flex;align-items:center;border:1.5px solid var(--border);background:var(--card);border-radius:8px;padding:0 10px;min-width:0;transition:border-color .15s,box-shadow .15s}
.inpwrap:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,43,77,.08)}
.inpwrap .pre,.inpwrap .suf{color:var(--dim);font-size:13px;font-weight:500}
.inpwrap .pre{padding-right:4px}.inpwrap .suf{padding-left:4px}
.inpwrap input{border:none;outline:none;background:transparent;font-size:14.5px;font-weight:600;font-family:inherit;color:var(--ink);padding:8px 0;width:100%;min-width:0;text-align:right}
.inpwrap input.txt{text-align:left;font-weight:600}
.inpwrap input::placeholder{color:var(--dim);font-weight:500}
.xbtn{width:30px;height:30px;border:none;background:none;color:var(--dim);font-size:19px;cursor:pointer;border-radius:6px;flex-shrink:0;line-height:1}
.xbtn:hover{color:var(--red);background:var(--red-bg)}
.rowsel{width:100%;border:1.5px solid var(--border);background:var(--card);border-radius:8px;padding:8px 8px;font-size:14px;font-weight:600;font-family:inherit;color:var(--ink);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.rowsel:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,43,77,.08)}
.revtag{font-size:11.5px;color:var(--dim);font-weight:600;font-style:italic;padding:8px 2px;text-align:right;line-height:1.3}
.addbtn{margin-top:14px;background:var(--card);border:1.5px dashed var(--border);border-radius:8px;padding:11px 22px;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .18s}
.addbtn:hover{border-color:var(--navy);color:var(--navy)}
.warn{font-size:12px;color:var(--red);font-weight:600;margin-top:8px}

/* ── LOAN FIELD GRID ── */
.fgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px 14px}
.field label{display:block;font-size:10px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;line-height:1.3;min-height:26px}
.field .inpwrap{padding:0 8px}
.field .inpwrap input{text-align:left}
.field select{width:100%;border:1.5px solid var(--border);background:var(--card);border-radius:8px;padding:8px 8px;font-size:14px;font-weight:600;font-family:inherit;color:var(--ink);cursor:pointer}
.field select:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,43,77,.08)}

/* ── TOTALS STRIP ── */
.totals{display:flex;flex-wrap:wrap;gap:22px;margin-top:18px;padding:18px 20px;background:var(--panel);border-radius:8px}
.tot{flex:1 1 130px}
.tot .k{font-size:11px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.7px}
.tot .v{font-size:22px;font-weight:800;color:var(--navy);letter-spacing:-.7px;margin-top:3px}
.tot .v.red{color:var(--red)}
.tot .v.gold{color:var(--gold)}

/* ── THE SHORT VERSION (three-up) ── */
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
.hcard{border-radius:10px;overflow:hidden}
.hcard .top{padding:8px;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.6px;color:#fff}
.hcard .body{padding:20px 16px;text-align:center}
.hcard .cap{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.9px;color:var(--dim)}
.hcard .big{font-size:38px;font-weight:800;letter-spacing:-1.6px;line-height:1.1;margin:6px 0 3px}
.hcard .fine{font-size:12.5px;color:var(--dim);line-height:1.5}
.hcard.now{background:var(--red-bg)}.hcard.now .top{background:var(--red)}.hcard.now .big{color:var(--red)}
.hcard.after{background:var(--panel)}.hcard.after .top{background:var(--navy)}.hcard.after .big{color:var(--navy)}
.hcard.res{background:var(--callout)}.hcard.res .top{background:var(--green)}.hcard.res .big{color:var(--navy-deep)}
.hcard.res .cap,.hcard.res .fine{color:var(--navy-deep);opacity:.85}

/* ── SPLIT LAYOUT ── */
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px}
.miniH{font-size:13px;font-weight:700;color:var(--navy);margin:0 0 3px}
.miniS{font-size:12px;color:var(--dim);margin-bottom:10px}

/* ── TABLES ── */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--panel);color:var(--dim);padding:10px 12px;text-align:right;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--border)}
.tbl th:first-child{text-align:left}
.tbl td{padding:10px 12px;text-align:right;border-bottom:1px solid #eef1f6;letter-spacing:-.2px;font-weight:600}
.tbl td:first-child{text-align:left;color:var(--muted)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.sum td{background:var(--panel);font-weight:800;color:var(--navy)}
.tbl .bad{color:var(--red)}
.tbl .save{color:var(--green-text)}
.tbl .quiet{color:var(--dim);font-weight:500}

/* ── LINE ITEMS ── */
.li{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid #eef1f6;font-size:13.5px}
.li .k{color:var(--muted)}
.li .v{font-weight:700;white-space:nowrap}
.li.tot{border-bottom:none;border-top:2px solid var(--green);color:var(--green-deep);padding-top:11px}
.li.tot .v{color:var(--green-deep)}

/* ── BARS ── */
.bars{display:flex;align-items:flex-end;justify-content:center;gap:40px;height:150px;margin:26px 0 10px}
.barcol{width:78px;text-align:center;position:relative;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.barcol .bh{border-radius:5px 5px 0 0}
.barcol .bv{font-weight:800;font-size:14px;margin-bottom:5px}
.barcol .bl{font-size:11.5px;color:var(--navy-deep);margin-top:7px;font-weight:600}
.barcol.a .bh{background:var(--red)}.barcol.a .bv{color:var(--red)}
.barcol.b .bh{background:var(--green)}.barcol.b .bv{color:var(--green-deep)}

/* ── CALLOUTS ── */
.band{background:var(--callout);border:1px solid #d6e2ac;border-radius:8px;padding:16px 18px;margin-top:16px}
.band .k{font-size:11px;font-weight:700;color:var(--green-deep);text-transform:uppercase;letter-spacing:1px}
.band .v{font-size:15px;font-weight:700;color:var(--green-deep);margin-top:5px;line-height:1.55}
.band.alert{background:var(--red-bg);border-color:var(--red-line)}
.band.alert .k,.band.alert .v{color:#8a1f1a}
.band.navy{background:var(--panel);border-color:var(--panel-line)}
.band.navy .k,.band.navy .v{color:var(--navy);text-align:center}

.para{font-size:13.5px;color:var(--muted);line-height:1.7;margin-top:16px}
.para strong{font-weight:700}

/* ── SPLIT BAR ── */
.splitbar{display:flex;height:38px;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin-top:10px}
.splitbar div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.splitlegend{display:flex;gap:22px;margin-top:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.splitlegend .sw{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:7px}

/* ── PAYBACK styles removed ── */

.note{font-size:12.5px;color:var(--dim);margin-top:8px;line-height:1.65;border-top:1px solid var(--border);padding-top:16px}

@media print{.no-print{display:none!important}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}}
@media(max-width:820px){
  .fgrid{grid-template-columns:1fr 1fr}
  .cols3{grid-template-columns:1fr;gap:24px}
}
@media(max-width:760px){
  .bar{padding:18px 20px}.wrap{padding:16px 14px 40px}
  .chead{display:none}
  .crow{border-top:1px solid var(--border);padding:14px 0;gap:8px}
  .crow .f-name{flex:1 1 100%}.crow .f-type{flex:1 1 100%}.crow .f-num{flex:1 1 calc(50% - 20px)}
  .three{grid-template-columns:1fr}
  .hcard .big{font-size:34px}
  .fgrid{grid-template-columns:1fr}
  .payback{grid-template-columns:1fr}

  .tbl{font-size:13px}.tbl td,.tbl th{padding:9px 8px}
}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState, useMemo} = React;

const money  = v => v==null||!isFinite(v) ? "$0" : new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(v);
const CAP = 1200;

/* months to pay off a balance at a fixed payment */
function monthsToPayoff(bal, pmt, apr){
  const r = apr/100/12;
  if(!(bal>0)||!(pmt>0)) return null;
  if(pmt <= bal*r + 1e-9) return {never:true};
  if(r===0) return {months:bal/pmt};
  return {months: Math.log(pmt/(pmt-bal*r))/Math.log(1+r)};
}
function totalInterest(bal, pmt, apr){
  const m = monthsToPayoff(bal,pmt,apr);
  if(!m || m.never) return {never:true};
  return {months:m.months, interest: pmt*m.months - bal};
}
/* months to pay off a loan principal at a monthly rate & payment */
function payoffMonths(principal, pmt, monthlyR){
  if(!(pmt>0)) return Infinity;
  if(pmt <= principal*monthlyR + 1e-9) return Infinity;
  if(monthlyR===0) return principal/pmt;
  return Math.log(pmt/(pmt-principal*monthlyR))/Math.log(1+monthlyR);
}
/* effective "like paying a rate of": rate whose full-term cost equals accelerated total cost */
function effRate(principal, totalPaid, termMonths){
  let lo=0, hi=0.35;
  for(let k=0;k<70;k++){
    const mid=(lo+hi)/2, r=mid/12;
    const pay = r===0 ? principal/termMonths : principal*r/(1-Math.pow(1+r,-termMonths));
    (pay*termMonths > totalPaid) ? hi=mid : lo=mid;
  }
  return (lo+hi)/2*100;
}

/* ── REVOLVING CARD: true minimum-payment compounding ──
   Most issuers recompute the minimum every month as (percent of balance) + that
   month's interest, floored at a dollar amount. The payment SHRINKS as the balance
   falls, so payoff drags on for decades. The `pmt` the user enters is treated as the
   starting minimum; we derive the issuer's percent from it so the sim matches reality. */
const MIN_FLOOR = 35;      // typical dollar floor
function revolvingMin(bal, apr, startPmt){
  if(!(bal>0)||!(apr>=0)) return {never:true, months:0, interest:0};
  const r = apr/100/12;
  const firstInt = bal*r;
  // The payment they gave us is the current minimum. If it can't cover this
  // month's interest, the balance grows forever — the classic never-payoff trap.
  if(startPmt>0 && startPmt <= firstInt + 1e-9) return {never:true, months:0, interest:0, startMin:startPmt, firstInt};
  // infer the issuer's "percent of balance" from the payment they gave us
  let pct = startPmt>0 ? (startPmt - firstInt)/bal : 0.01;
  if(!isFinite(pct)||pct<=0) pct = 0.01;
  const floor = Math.max(MIN_FLOOR, startPmt>0 ? Math.min(startPmt, MIN_FLOOR) : MIN_FLOOR);
  let b=bal, ti=0, m=0;
  const startMin = Math.max(pct*bal + firstInt, floor);
  while(b>0.005 && m<1200){
    const i = b*r;
    let pay = Math.max(pct*b + i, floor);
    if(pay >= b+i) pay = b+i;
    const pr = pay - i;
    if(pr <= 1e-6) return {never:true, months:0, interest:0, startMin, firstInt};
    b -= pr; if(b<0.005) b=0;
    ti += i; m++;
  }
  if(m>=1200) return {never:true, months:0, interest:0, startMin, firstInt};
  return {never:false, months:m, interest:ti, startMin, firstInt};
}
/* Run a revolving card forward N months of shrinking minimums; report where it lands. */
function revolvingForward(bal, apr, startPmt, months){
  const r = apr/100/12;
  const firstInt = bal*r;
  let pct = (startPmt>0 && startPmt>firstInt) ? (startPmt - firstInt)/bal : 0.01;
  if(!isFinite(pct)||pct<=0) pct = 0.01;
  const floor = Math.max(MIN_FLOOR, startPmt>0 ? Math.min(startPmt, MIN_FLOOR) : MIN_FLOOR);
  let b=bal, paid=0, ti=0;
  for(let k=0;k<months;k++){
    if(b<=0.005){ b=0; break; }
    const i=b*r;
    let pay=Math.max(pct*b+i, floor);
    // if their real payment can't cover interest, model the balance growing
    if(startPmt>0 && startPmt<=i){ pay = startPmt; }
    if(pay>=b+i) pay=b+i;
    const pr=pay-i;
    if(pr<=0){ b += i-pay; paid+=pay; ti+=i; continue; }  // balance grows
    b-=pr; paid+=pay; ti+=i;
  }
  return {balance:Math.max(0,b), paid, interest:ti, principalGone: bal-Math.max(0,b)};
}

const TYPES = ["Mortgage","HELOC","Installment","Revolving"];
const isRevolving = t => t==="Revolving";

let uid = 100;
const newDebt = () => ({id:++uid, name:"", type:"Revolving", bal:"", pmt:"", apr:"", months:""});

function App(){
  const [debts,setDebts] = useState([
    {id:1, name:"PENFED",   type:"HELOC",       bal:"123,335.84", pmt:"845.22", apr:"7.875", months:""},
    {id:2, name:"BEST EGG", type:"Installment", bal:"31,177",     pmt:"695",    apr:"14",    months:"54"},
    {id:3, name:"DISCOVER", type:"Revolving",   bal:"13,539",     pmt:"495",    apr:"23",    months:""},
  ]);
  const [loanAmt,setLoanAmt] = useState("175,000");
  const [rate,setRate]       = useState("6.75");
  const [term,setTerm]       = useState("30");
  const [rateType,setRateType] = useState("Adjustable");
  const [newPmt,setNewPmt]   = useState("1,330");
  const [cashOut,setCashOut] = useState("2,631");

  const n = s => { const v=parseFloat(String(s).replace(/[$,%\s]/g,"")); return isFinite(v)?v:0; };

  const upd = (id,k,v) => setDebts(ds=>ds.map(d=>d.id===id?{...d,[k]:v}:d));
  const add = () => setDebts(ds=>[...ds, newDebt()]);
  const rm  = id => setDebts(ds=>ds.filter(d=>d.id!==id));

  const R = useMemo(()=>{
    const rows = debts.map(d=>{
      const bal=n(d.bal), pmt=n(d.pmt), apr=n(d.apr), mo=n(d.months);
      let ti;
      if(isRevolving(d.type)){
        // Revolving: shrinking-minimum compounding model
        const rev = revolvingMin(bal, apr, pmt);
        ti = rev.never ? {never:true} : {months:rev.months, interest:rev.interest};
      } else if(mo>0){
        // Term debt with a known number of months remaining: interest = payments made - balance
        ti = {months:mo, interest: Math.max(0, pmt*mo - bal)};
      } else {
        // Term debt but months not entered — fall back to solving from the payment
        ti = totalInterest(bal,pmt,apr);
      }
      return {...d, bal, pmt, apr, mo, rev:isRevolving(d.type), ti};
    }).filter(d=>d.bal>0||d.pmt>0);

    const totBal = rows.reduce((s,d)=>s+d.bal,0);
    const totPmt = rows.reduce((s,d)=>s+d.pmt,0);
    // Blended (weighted-average) rate across current debts, weighted by balance
    const blended = totBal>0 ? rows.reduce((s,d)=>s+d.apr*d.bal,0)/totBal : 0;

    const loan   = n(loanAmt);
    const rt     = n(rate);
    const tm     = n(term)||30;
    const np     = n(newPmt);
    const cash   = n(cashOut);
    const r      = rt/100/12;

    const mSave = totPmt - np;
    const ySave = mSave*12;

    // accelerate: add % of monthly savings back to loan
    const accel = [0,.25,.5,.75,1].map(p=>{
      const extra = mSave*p;
      const pay   = np+extra;
      const mo    = payoffMonths(loan, pay, r);
      const yrs   = mo/12;
      const eff   = p===0 ? null : effRate(loan, pay*mo, tm*12);
      return {p, extra, pay, yrs, mo, eff};
    });
    const normalInt = np*payoffMonths(loan,np,r) - loan;
    const fullPay   = np+mSave;
    const fullMo    = payoffMonths(loan, fullPay, r);
    const fullInt   = fullPay*fullMo - loan;
    const intSaved  = normalInt - fullInt;

    // do nothing
    let dnInt=0, dnWorst=0, anyNever=false;
    const dn = rows.map(d=>{
      if(d.ti && d.ti.never){ anyNever=true; return {...d, never:true}; }
      dnInt += d.ti.interest; dnWorst = Math.max(dnWorst, d.ti.months/12);
      return {...d, never:false, years:d.ti.months/12, interest:d.ti.interest};
    });

    // ── Revolving cards: minimum-payment compounding story ──
    const revCards = rows.filter(d=>d.rev);
    const revBal   = revCards.reduce((s,d)=>s+d.bal,0);
    const revPmt   = revCards.reduce((s,d)=>s+d.pmt,0);
    let revInt=0, revNeverAny=false, revWorstMo=0;
    revCards.forEach(d=>{
      const rv = revolvingMin(d.bal,d.apr,d.pmt);
      if(rv.never){ revNeverAny=true; }
      else { revInt += rv.interest; revWorstMo = Math.max(revWorstMo, rv.months); }
    });
    const revTotalPaid = revBal + revInt;
    // cost of waiting: forward the whole revolving stack N months
    const waitPts = [6,12,24,36,60].map(w=>{
      let bal=0, paid=0, ti=0, gone=0;
      revCards.forEach(d=>{
        const f = revolvingForward(d.bal,d.apr,d.pmt,w);
        bal+=f.balance; paid+=f.paid; ti+=f.interest; gone+=f.principalGone;
      });
      return {w, bal, paid, interest:ti, gone};
    });

    return {rows, totBal, totPmt, blended, loan, rt, tm, np, cash, r,
            mSave, ySave, accel, fullMo, intSaved, dn, dnInt, dnWorst, anyNever, rateType,
            revCards, revBal, revPmt, revInt, revTotalPaid, revNeverAny, revWorstMo, waitPts};
  },[debts,loanAmt,rate,term,rateType,newPmt,cashOut]);

  const has = R.rows.length>0 && R.totBal>0;
  const hasRev = R.revCards.length>0;

  return(
  <div>
    <header className="bar">
      <h1>Debt Consolidation <span>Calculator</span></h1>
    </header>

    <div className="wrap">

      {/* ══════ INPUT: DEBTS ══════ */}
      <div className="card no-print">
        <div className="cardhdr">Current debts being paid off <span>— pull every balance from the credit report</span></div>
        <div className="cardbody">
          <div className="chead">
            <span className="c-name">Creditor</span>
            <span className="c-type">Type</span>
            <span className="c-num">Balance</span>
            <span className="c-num">Payment</span>
            <span className="c-num">Rate</span>
            <span className="c-num">Months left</span>
            <span className="c-x"></span>
          </div>
          {debts.map((d,i)=>(
            <div className="crow" key={d.id}>
              <div className="f-name"><div className="inpwrap"><input className="txt" value={d.name} placeholder={"Creditor "+(i+1)} onChange={e=>upd(d.id,'name',e.target.value)}/></div></div>
              <div className="f-type"><select className="rowsel" value={d.type} onChange={e=>upd(d.id,'type',e.target.value)}>{TYPES.map(t=><option key={t}>{t}</option>)}</select></div>
              <div className="f-num"><div className="inpwrap"><span className="pre">$</span><input value={d.bal} inputMode="decimal" placeholder="0" onChange={e=>upd(d.id,'bal',e.target.value)}/></div></div>
              <div className="f-num"><div className="inpwrap"><span className="pre">$</span><input value={d.pmt} inputMode="decimal" placeholder="0" onChange={e=>upd(d.id,'pmt',e.target.value)}/></div></div>
              <div className="f-num"><div className="inpwrap"><input value={d.apr} inputMode="decimal" placeholder="0.00" onChange={e=>upd(d.id,'apr',e.target.value)}/><span className="suf">%</span></div></div>
              <div className="f-num">
                {isRevolving(d.type)
                  ? <div className="revtag">Revolving — no end date</div>
                  : <div className="inpwrap"><input value={d.months} inputMode="numeric" placeholder="0" onChange={e=>upd(d.id,'months',e.target.value)}/><span className="suf">mo</span></div>}
              </div>
              <button className="xbtn" onClick={()=>rm(d.id)} title="Remove" aria-label="Remove debt">×</button>
            </div>
          ))}
          <button className="addbtn" onClick={add}>+ Add another debt</button>

          <div className="totals">
            <div className="tot"><div className="k">Debts</div><div className="v">{R.rows.length}</div></div>
            <div className="tot"><div className="k">Total balance</div><div className="v">{money(R.totBal)}</div></div>
            <div className="tot"><div className="k">Total payments</div><div className="v red">{money(R.totPmt)}<span style={{fontSize:13,fontWeight:500,color:'var(--dim)'}}>/mo</span></div></div>
            <div className="tot"><div className="k">Blended rate now</div><div className="v gold">{R.blended.toFixed(2)}%</div></div>
          </div>
        </div>
      </div>

      {/* ══════ INPUT: LOAN ══════ */}
      <div className="card no-print">
        <div className="cardhdr">Proposed loan &amp; client details</div>
        <div className="cardbody">
          <div className="fgrid">
            <div className="field"><label>New loan amount</label><div className="inpwrap"><span className="pre">$</span><input value={loanAmt} inputMode="decimal" onChange={e=>setLoanAmt(e.target.value)}/></div></div>
            <div className="field"><label>Interest rate</label><div className="inpwrap"><input value={rate} inputMode="decimal" onChange={e=>setRate(e.target.value)}/><span className="suf">%</span></div></div>
            <div className="field"><label>Term</label><div className="inpwrap"><input value={term} inputMode="numeric" onChange={e=>setTerm(e.target.value)}/><span className="suf">yrs</span></div></div>
            <div className="field"><label>Rate type</label><select value={rateType} onChange={e=>setRateType(e.target.value)}><option>Fixed</option><option>Adjustable</option></select></div>
            <div className="field"><label>New payment w/ taxes &amp; ins</label><div className="inpwrap"><span className="pre">$</span><input value={newPmt} inputMode="decimal" onChange={e=>setNewPmt(e.target.value)}/></div></div>
            <div className="field"><label>Extra cash to client</label><div className="inpwrap"><span className="pre">$</span><input value={cashOut} inputMode="decimal" onChange={e=>setCashOut(e.target.value)}/></div></div>
          </div>
        </div>
      </div>

      {has && <>
        {/* ══════ THE SHORT VERSION ══════ */}
        <div className="three">
          <div className="hcard now"><div className="top">Now</div><div className="body"><div className="cap">What you pay today</div><div className="big">{money(R.totPmt)}</div><div className="fine">Mortgage plus the debts below</div></div></div>
          <div className="hcard after"><div className="top">After</div><div className="body"><div className="cap">What you'd pay instead</div><div className="big">{money(R.np)}</div><div className="fine">One payment. That's it.</div></div></div>
          <div className="hcard res"><div className="top">Results</div><div className="body"><div className="cap">What you keep each month</div><div className="big">{money(R.mSave)}</div><div className="fine">{money(R.ySave)} back every year</div></div></div>
        </div>

        {/* ══════ WHERE THE MONEY GOES ══════ */}
        <div className="card">
          <div className="cardhdr">Current situation vs new loan details</div>
          <div className="cardbody">
            <div className="cols3">
              {/* debts paid off */}
              <div>
                <div className="miniH">Current debts you pay now</div>
                <table className="tbl">
                  <thead><tr><th>Who you owe</th><th>Balance</th><th>Payment</th></tr></thead>
                  <tbody>
                    {R.rows.map(d=><tr key={d.id}><td>{d.name||"—"}</td><td>{money(d.bal)}</td><td>{money(d.pmt)}</td></tr>)}
                    <tr className="sum"><td>Total today</td><td>{money(R.totBal)}</td><td>{money(R.totPmt)}</td></tr>
                  </tbody>
                </table>
                <div className="band navy" style={{marginTop:14}}>
                  <div className="k">Blended rate on these debts</div>
                  <div className="v" style={{fontSize:26,letterSpacing:'-1px'}}>{R.blended.toFixed(2)}%</div>
                </div>
              </div>

              {/* payment comparison chart */}
              <div>
                <div className="miniH">Total monthly debt payments vs new loan payment</div>
                <div className="bars">
                  {(()=>{const mx=Math.max(R.totPmt,R.np)||1;return<>
                    <div className="barcol a"><div className="bv">{money(R.totPmt)}</div><div className="bh" style={{height:(R.totPmt/mx*130)+'px'}}></div><div className="bl">Total monthly debts you pay today</div></div>
                    <div className="barcol b"><div className="bv">{money(R.np)}</div><div className="bh" style={{height:(R.np/mx*130)+'px'}}></div><div className="bl">New monthly payment</div></div>
                  </>;})()}
                </div>
                <div className="hcard res" style={{marginTop:18}}><div className="top">Results</div><div className="body"><div className="cap">What you keep each month</div><div className="big">{money(R.mSave)}</div><div className="fine">{money(R.ySave)} back every year</div></div></div>
              </div>

              {/* new loan + cash at closing */}
              <div>
                <div className="miniH">Your new loan</div>
                <div className="li"><span className="k">Amount you're borrowing</span><span className="v">{money(R.loan)}</span></div>
                <div className="li"><span className="k">Interest rate</span><span className="v">{R.rt}%</span></div>
                <div className="li"><span className="k">Loan term</span><span className="v">{R.tm} years</span></div>
                <div className="li"><span className="k">New monthly payment</span><span className="v">{money(R.np)}</span></div>
                <div className="li"><span className="k">Will the rate change?</span><span className="v">{R.rateType==="Adjustable"?"Yes, it can adjust":"No, it's fixed"}</span></div>
                <div className="miniH" style={{marginTop:18}}>Money you receive at closing</div>
                <div className="miniS">Cash back when the loan funds</div>
                <div className="li"><span className="k">Extra cash in hand</span><span className="v">{money(R.cash)}</span></div>
                <div className="li tot"><span className="k">Total money in your pocket</span><span className="v">{money(R.cash)}</span></div>
                <div className="band navy" style={{marginTop:14}}>
                  <div className="v" style={{fontSize:16}}>One loan. One payment. One due date.</div>
                </div>
              </div>
            </div>
          </div>
        </div>

        {/* ══════ OWN IT SOONER ══════ */}
        <div className="card">
          <div className="cardhdr">Want to pay this off sooner? <span>— optional accelerated payoff</span></div>
          <div className="cardbody">
            <p className="para" style={{marginTop:0}}>Send part of your monthly savings back to the loan and you finish years early, skipping a large amount of interest.</p>
            <table className="tbl">
              <thead><tr><th>If you add this each month</th><th>Your payment becomes</th><th>Mortgage-free in</th><th>Like paying a rate of</th></tr></thead>
              <tbody>
                {R.accel.map((a,i)=>(
                  <tr key={i}>
                    <td>{a.p===0 ? <span className="quiet">Nothing extra</span> : <>{money(a.extra)} <span className="quiet">({a.p*100}% of savings)</span></>}</td>
                    <td>{money(a.pay)}</td>
                    <td>{a.p===0 ? R.tm+" years" : a.yrs.toFixed(1)+" years"}</td>
                    <td className={a.p===0?'quiet':'save'}>{a.p===0 ? "—" : a.eff.toFixed(3)+"%"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="band">
              <div className="v">Keep paying {money(R.totPmt)} a month — exactly what you pay today — and you'd be mortgage-free in {(R.fullMo/12).toFixed(1)} years instead of {R.tm}, saving you {money(R.intSaved)} in interest. Same money out of pocket, very different finish line.</div>
            </div>
          </div>
        </div>

        {/* ══════ CREDIT CARD MINIMUM-PAYMENT TRAP ══════ */}
        {hasRev && <div className="card">
          <div className="cardhdr">The credit card trap <span>— what minimum payments really cost</span></div>
          <div className="cardbody">
            <p className="para" style={{marginTop:0}}>Credit cards have no end date. The minimum payment is recalculated every month as a small percent of the balance plus that month's interest — so as the balance drops, the payment shrinks too. Most of every dollar goes to interest, and payoff drags on for decades{R.revNeverAny ? ", or never happens at all" : ""}.</p>

            <table className="tbl">
              <thead><tr><th>Card</th><th>Balance</th><th>Rate</th><th>Min payment</th><th>Years to payoff</th><th>Interest you'll pay</th></tr></thead>
              <tbody>
                {R.revCards.map(d=>{
                  const never = d.ti.never;
                  return (
                    <tr key={d.id}>
                      <td>{d.name||"—"}</td><td>{money(d.bal)}</td><td>{d.apr}%</td><td>{money(d.pmt)}</td>
                      {never
                        ? <><td className="bad">Never</td><td className="bad">No end</td></>
                        : <><td>{(d.ti.months/12).toFixed(1)} yrs</td><td className="bad">{money(d.ti.interest)}</td></>}
                    </tr>
                  );
                })}
                <tr className="sum"><td>All cards</td><td>{money(R.revBal)}</td><td></td><td>{money(R.revPmt)}</td><td>{R.revNeverAny ? "Never" : (R.revWorstMo/12).toFixed(1)+" yrs"}</td><td className="bad">{money(R.revInt)}</td></tr>
              </tbody>
            </table>

            {/* balance vs interest split */}
            <div style={{marginTop:20}}>
              <div className="miniH">Where the money goes on {money(R.revBal)} of card balances</div>
              <div className="splitbar">
                <div style={{width:(R.revBal/R.revTotalPaid*100)+'%',background:'var(--navy)'}}>{(R.revBal/R.revTotalPaid)>0.13 && Math.round(R.revBal/R.revTotalPaid*100)+'%'}</div>
                <div style={{width:(R.revInt/R.revTotalPaid*100)+'%',background:'var(--red)'}}>{(R.revInt/R.revTotalPaid)>0.13 && Math.round(R.revInt/R.revTotalPaid*100)+'%'}</div>
              </div>
              <div className="splitlegend">
                <span><span className="sw" style={{background:'var(--navy)'}}></span>What they borrowed {money(R.revBal)}</span>
                <span><span className="sw" style={{background:'var(--red)'}}></span>Interest {money(R.revInt)}</span>
              </div>
            </div>

            {/* cost of waiting */}
            <div style={{marginTop:22}}>
              <div className="miniH">The cost of waiting</div>
              <div className="miniS">Paying only the minimums, here's how little the balance actually moves</div>
              <table className="tbl">
                <thead><tr><th>If they wait</th><th>They'll have paid</th><th>Of that, interest</th><th>Balance still owed</th><th>Principal actually gone</th></tr></thead>
                <tbody>
                  {R.waitPts.map(w=>(
                    <tr key={w.w}>
                      <td>{w.w} months</td>
                      <td>{money(w.paid)}</td>
                      <td className="bad">{money(w.interest)}</td>
                      <td>{money(w.bal)}</td>
                      <td className="save">{money(w.gone)}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div className="band alert">
              <div className="v">{R.revNeverAny
                ? "On at least one card, the minimum payment doesn't even cover the interest — the balance grows every month no matter how long they pay. On the cards that do get paid, minimum payments cost "+money(R.revInt)+" in interest along the way."
                : "Paying only the minimums, these cards take "+(R.revWorstMo/12).toFixed(1)+" years to clear and cost "+money(R.revInt)+" in interest — "+(R.revInt>R.revBal ? (R.revInt/R.revBal).toFixed(1)+"× what was actually borrowed. " : "")+"Rolling them into the new loan stops the compounding today."}
              </div>
            </div>
          </div>
        </div>}

        {/* ══════ DO NOTHING ══════ */}
        <div className="card">
          <div className="cardhdr">What happens if you do nothing</div>
          <div className="cardbody">
            <p className="para" style={{marginTop:0}}>At the payments you're making today, here's how long each debt sticks around and what it costs in interest.</p>
            <table className="tbl">
              <thead><tr><th>Debt</th><th>Balance</th><th>Rate</th><th>Payment</th><th>Years to gone</th><th>Interest you'll pay</th></tr></thead>
              <tbody>
                {R.dn.map(d=>(
                  <tr key={d.id}>
                    <td>{d.name||"—"}</td><td>{money(d.bal)}</td><td>{d.apr}%</td><td>{money(d.pmt)}</td>
                    {d.never
                      ? <><td className="bad">Never</td><td className="bad">No end</td></>
                      : <><td>{d.years.toFixed(1)} yrs</td><td className="bad">{money(d.interest)}</td></>}
                  </tr>
                ))}
                <tr className="sum"><td>Doing nothing</td><td>{money(R.totBal)}</td><td></td><td>{money(R.totPmt)}</td><td>{R.dnWorst.toFixed(1)} yrs</td><td className="bad">{money(R.dnInt)}</td></tr>
              </tbody>
            </table>
            <div className="band alert">
              <div className="v">Staying on this path costs about {money(R.dnInt)} in interest before these debts are gone{R.anyNever ? ", and at least one debt marked \u201CNever\u201D isn't being paid down at all — its real cost has no ceiling." : ", and the last one doesn't clear for "+R.dnWorst.toFixed(1)+" years."} This plan pays every one of them off at closing.</div>
            </div>
          </div>
        </div>
      </>}

      {!has && <div className="card"><div className="cardbody"><p className="para" style={{marginTop:0}}>Add at least one debt with a balance to build the proposal.</p></div></div>}

      <p className="note">
        The "like paying a rate of" figure compares the total cost of your loan when paid off early against what a full 30-year loan at that rate would cost — a comparison tool, not the rate on your loan. Balances, payments, and rates for current debts come from the information you provided. This is a proposal, not a loan commitment or an offer to lend; final numbers are confirmed in your official Loan Estimate and at closing.
      </p>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
